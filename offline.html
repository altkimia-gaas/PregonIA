<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080B12">
<meta name="robots" content="noindex">
<title>Sin conexión · PregonIA</title>
<style>
:root{--bg:#080B12;--surface:#111827;--ink:#F0F4FF;--muted:#8B9DC3;--line:#1E2D4A;--btn:#1976D2;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#F4F4F0;--surface:#fff;--ink:#111827;--muted:#56627A;--line:#D8D4CC;--btn:#1565C0;color-scheme:light}}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center}
main{max-width:420px;padding:32px max(20px,env(safe-area-inset-left,0px));text-align:center}
img{width:72px;height:72px;border-radius:16px}
h1{font-size:22px;margin:18px 0 8px}
p{margin:0 0 22px;color:var(--muted)}
button{background:var(--btn);color:#fff;border:0;border-radius:8px;padding:12px 22px;font:600 16px Inter,system-ui,sans-serif;min-height:44px;cursor:pointer}
</style>
</head>
<body>
<main>
<img src="/icono-192.png" alt="" width="72" height="72">
<h1>Sin conexión</h1>
<p>PregonIA necesita internet para leer los medios. Revisa la señal o el wifi y vuelve a intentarlo; los avisos que lleguen mientras tanto quedan en la campana.</p>
<button type="button" onclick="location.reload()">Reintentar</button>
</main>
<script>addEventListener("online", () => location.reload());</script>
</body>
</html>
