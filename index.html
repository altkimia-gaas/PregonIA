<title>PregonIA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sala de situación — barra superior con el estado del monitoreo, secciones en pestañas, tarjetas sobrias y el color reservado para el riesgo (crítico, atención, favorable). Titulares de prensa en serif; análisis de PregonIA en sans. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EDF1F5; --ink:#132235; --muted:#5B6A7C; --line:#DAE1E9; --track:#E6EBF1;
  --top:#0F2236; --top-ink:#E8EEF5; --top-muted:#9FB0C4; --top-line:#263D55; --top-accent:#8FB8EA; --live:#3DD6B5;
  --accent:#1E4D8C; --accent-ink:#FFFFFF; --accent-soft:#E4ECF7;
  --bell:#A8650F; --bell-soft:#FBEFD9;
  --pos:#00897B; --pos-soft:#DCF1EE; --pos-ink:#00695E;
  --neu:#A3AEBB; --neu-soft:#EDF0F4; --neu-ink:#525F6E;
  --cri:#C8412C; --cri-soft:#FBE7E2; --cri-ink:#A23422;
  --amb-n:#1F3A5F; --amb-r:#5476A0; --amb-l:#8FA6C4;
  --shadow:0 1px 2px rgba(16,34,54,.06),0 1px 3px rgba(16,34,54,.04);
  --f-display:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-news:"Newsreader",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B131D; --surface:#121D2A; --surface-2:#192737; --ink:#E5ECF4; --muted:#97A6B8; --line:#243548; --track:#1E2D3F;
  --top:#070E17; --top-ink:#E5ECF4; --top-muted:#8C9DB2; --top-line:#1F3045; --top-accent:#8FB8EA; --live:#3DD6B5;
  --accent:#7FAAE0; --accent-ink:#0B131D; --accent-soft:#1A2C45;
  --bell:#E9A44C; --bell-soft:#33260F;
  --pos:#20A493; --pos-soft:#0F2E2B; --pos-ink:#5FD0C0;
  --neu:#5F6E80; --neu-soft:#1C2836; --neu-ink:#A8B5C4;
  --cri:#E0604A; --cri-soft:#3A1C16; --cri-ink:#F39582;
  --amb-n:#A9C6EA; --amb-r:#6F93C0; --amb-l:#3F5878;
  --shadow:none; color-scheme:dark;
} }
:root[data-theme="dark"]{
  --bg:#0B131D; --surface:#121D2A; --surface-2:#192737; --ink:#E5ECF4; --muted:#97A6B8; --line:#243548; --track:#1E2D3F;
  --top:#070E17; --top-ink:#E5ECF4; --top-muted:#8C9DB2; --top-line:#1F3045; --top-accent:#8FB8EA; --live:#3DD6B5;
  --accent:#7FAAE0; --accent-ink:#0B131D; --accent-soft:#1A2C45;
  --bell:#E9A44C; --bell-soft:#33260F;
  --pos:#20A493; --pos-soft:#0F2E2B; --pos-ink:#5FD0C0;
  --neu:#5F6E80; --neu-soft:#1C2836; --neu-ink:#A8B5C4;
  --cri:#E0604A; --cri-soft:#3A1C16; --cri-ink:#F39582;
  --amb-n:#A9C6EA; --amb-r:#6F93C0; --amb-l:#3F5878;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.demo{background:var(--bell-soft);border-bottom:1px solid var(--line);padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:12.5px}
.demo b{color:var(--bell)}
.app{display:grid;grid-template-columns:236px minmax(0,1fr)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;align-self:start;height:100vh;overflow:auto}
.brand h1{font-family:var(--f-display);font-size:24px;line-height:1;margin:0;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}
.brand{padding:0 6px}
.org label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 6px 4px}
.org select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-weight:600}
.plan{margin:6px 6px 0;font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 10px 4px}
.nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .count,.bnav .count{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:var(--cri);color:#fff;border-radius:99px;padding:1px 7px;font-weight:600}
.usage{display:flex;flex-direction:column;gap:5px;margin:10px 6px 0}
.usage .row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.usage a{font-size:11.5px;font-weight:600}
.side .foot{margin-top:auto;font-size:11.5px;color:var(--muted);padding:0 6px}
.bnav{display:none}
.main{padding-block:24px 64px;padding-left:max(16px,min(4vw,40px));padding-right:max(16px,min(4vw,40px));min-width:0;max-width:1240px}
.main:focus{outline:none}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.head h2{font-family:var(--f-display);font-size:28px;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
.head h2:focus{outline:none}
.head p{margin:5px 0 0;color:var(--muted);max-width:66ch}
.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;text-decoration:none;margin-bottom:8px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card > h3,.sec{font-size:12px;margin:0 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
button.kpi{display:block;text-align:left;cursor:pointer;width:100%;transition:border-color .15s}
button.kpi:hover{border-color:var(--accent)}
.kpi .k{font-size:12.5px;font-weight:600;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-size:32px;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:12.5px;margin-top:4px}
.kpi .go{font-size:12px;color:var(--accent);font-weight:600;margin-top:8px}
.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ic::before{display:none}
.pill .ico{width:13px;height:13px;stroke-width:2.2}
.t-pos{background:var(--pos-soft);color:var(--pos-ink)} .t-neu{background:var(--neu-soft);color:var(--neu-ink)} .t-cri{background:var(--cri-soft);color:var(--cri-ink)}
.e-listo,.done{background:var(--pos-soft);color:var(--pos-ink)} .e-requiere_ajuste{background:var(--bell-soft);color:var(--bell)} .e-restringido{background:var(--cri-soft);color:var(--cri-ink)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;background:var(--surface-2);border-radius:5px;padding:1px 6px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13px;text-decoration:none;color:var(--ink);min-height:36px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding:6px 8px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{padding:5px 10px;min-height:30px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.onb{background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;display:grid;gap:10px}
.onb h3{margin:0;font-family:var(--f-display);font-size:18px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;list-style:none;margin:0;padding:0}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.steps .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.steps li.ok{opacity:.7}
.steps li.ok .n{color:var(--pos);font-weight:600}
.today{display:flex;flex-direction:column;gap:8px}
.today li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--cri);border-radius:8px;background:var(--surface)}
.today ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.allgood{display:flex;gap:10px;align-items:center;padding:12px;border-radius:8px;background:var(--pos-soft);color:var(--pos-ink);font-weight:600}
.feed{display:flex;flex-direction:column;gap:10px}
.day{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 0}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px}
.item.cri{border-left:3px solid var(--cri)}
.item.resp{border-left:3px solid var(--pos)}
.item h4{margin:0;font-size:15.5px;line-height:1.35;text-wrap:pretty}
.item .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.item .res{margin:0}
.item details{font-size:12.5px;color:var(--muted)}
.item summary{cursor:pointer;color:var(--accent);font-weight:600;width:max-content;list-style:none}
.item summary::-webkit-details-marker{display:none}
.item summary::after{content:" ▾"}
.item details[open] summary::after{content:" ▴"}
.item details p{margin:6px 0 0}
.item .acts{grid-column:2;grid-row:1 / span 4;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.filters select,.filters input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:36px}
.filters input{min-width:0;flex:1 1 200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 11px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted);border-right:1px solid var(--line);min-height:36px;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg .c{font-family:var(--f-mono);font-weight:500;margin-left:4px}
.active{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin:0 0 6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.scroll{overflow-x:auto}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;display:block}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.full i{background:var(--bell)}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rows li button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) 110px 30px;gap:10px;align-items:center;width:100%;padding:7px 6px;border-radius:6px;cursor:pointer}
.rows li button:hover{background:var(--surface-2)}
.rows li button:focus-visible{outline:2px solid var(--accent)}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.list li{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label,.field legend,.lbl{font-size:12.5px;font-weight:600;color:var(--ink)}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%;min-height:36px}
.field textarea{min-height:110px;resize:vertical;line-height:1.5}
.field small,.hint{color:var(--muted);font-size:12px}
fieldset{border:0;padding:0;margin:0;min-width:0}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:500;cursor:pointer;background:var(--surface)}
.checks input{accent-color:var(--accent)}
.span2{grid-column:1 / -1}
.prop{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.prow .num{font-family:var(--f-mono);color:var(--muted);font-size:12px}
.prow.sug{border-style:dashed}
.origin{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.subtabs,.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.subtabs a,.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;text-decoration:none;font-size:13.5px}
.subtabs a[aria-current="page"],.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tema{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tema .top{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 14px}
.tema .top h4{margin:1px 0 0;font-size:15.5px}
.tema .body{border-top:1px solid var(--line);padding:14px;display:grid;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:40px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:99px;padding:3px 4px 3px 10px;font-size:12.5px}
.chip.ex{background:var(--cri-soft);color:var(--cri)}
.chip button{border:0;background:none;cursor:pointer;width:22px;height:22px;border-radius:50%;color:inherit;font-size:15px;line-height:1}
.chip button:hover{background:var(--line)}
.chips input{border:0;outline:0;background:none;flex:1 1 140px;min-width:120px;padding:4px 6px;min-height:28px}
.chips:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{position:relative;display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt b{font-size:13.5px}
.opt span{font-size:12px;color:var(--muted)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.opt .rec{order:-1;font-size:10.5px;font-weight:700;color:var(--pos);text-transform:uppercase;letter-spacing:.04em}
.stepper{display:grid;gap:18px}
.stepper > section{display:grid;gap:8px}
.stepper h3{margin:0;font-size:15px;display:flex;gap:8px;align-items:center}
.stepper h3 .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;font-family:var(--f-mono)}
.mini{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface-2);display:grid;gap:4px}
details.kb summary{cursor:pointer;font-weight:600;font-size:13px}
.draft{white-space:pre-wrap;font-family:var(--f-body);min-height:280px;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface);width:100%;line-height:1.55}
.note{font-size:12.5px;color:var(--ink);border-left:3px solid var(--bell);padding:6px 10px;background:var(--bell-soft);border-radius:0 6px 6px 0;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;gap:12px;align-items:center;max-width:calc(100vw - 32px);z-index:30}
.toast button{border:0;background:none;color:var(--accent-soft);font-weight:700;cursor:pointer;padding:4px 6px}
.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:12px}
.timeline li{padding-left:14px;position:relative}
.timeline li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--cri)}
.repdesc{margin:-6px 0 14px;color:var(--muted);font-size:13px}

/* Reportes: cada resultado se lee como gráfico y como cifra */
.rgrid{display:grid;gap:14px}
.r4{grid-template-columns:repeat(4,minmax(0,1fr))}
.r3{grid-template-columns:repeat(3,minmax(0,1fr))}
.r21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.rhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px;margin:0 0 14px}
.rhead h3{margin:0;font-family:var(--f-display);font-size:21px;letter-spacing:-.01em}
.rhead .per{color:var(--muted);font-size:13px;display:inline-flex;gap:6px;align-items:center}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;align-content:start;min-width:0}
.tile .top{display:flex;align-items:center;gap:10px}
.chipi{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.chipi.cri{background:var(--cri-soft);color:var(--cri-ink)} .chipi.pos{background:var(--pos-soft);color:var(--pos-ink)} .chipi.neu{background:var(--neu-soft);color:var(--neu-ink)}
.chipi .ico{width:18px;height:18px}
.tile .lb{font-size:13px;font-weight:600;color:var(--muted);line-height:1.25}
.tile .big{font-family:var(--f-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .big small{font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.delta.up-bad{color:var(--cri-ink)} .delta.up-good{color:var(--pos-ink)}
.delta .ico{width:13px;height:13px;stroke-width:2.4}
.sub{font-size:12.5px;color:var(--muted)}
.spark{display:block;width:100%;height:40px}
.gauge{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--cri-soft) 0 50%,var(--pos-soft) 50% 100%);margin:6px 0 2px}
.gauge::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.gauge i{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.scale{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.segbar{display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden}
.segbar span{display:block;height:100%;min-width:3px}
.segbar.tall{height:22px}
.meter{height:10px;border-radius:99px;background:var(--cri-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--cri);border-radius:99px}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink)}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.keys b{font-family:var(--f-mono);font-weight:500}
.find{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.find li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center}
.find p{margin:0}
.tone3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.tone3 div{display:grid;gap:2px;justify-items:start}
.tone3 .n{font-family:var(--f-display);font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums}
.tone3 .l{font-size:12px;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.tone3 .l .ico{width:14px;height:14px}
.div{display:grid;gap:2px}
.div .hd,.div .rw{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 54px 54px 54px 118px;gap:12px;align-items:center}
.div .hd{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:0 6px 6px;border-bottom:1px solid var(--line)}
.div .hd .ax{display:flex;justify-content:space-between}
.div .rw{padding:8px 6px;border-radius:8px;cursor:pointer}
.div .rw:hover,.div .rw:focus-visible{background:var(--surface-2)}
.div .nm{font-weight:600;font-size:13px;line-height:1.3}
.div .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.div .num.c{color:var(--cri-ink)} .div .num.p{color:var(--pos-ink)}
.dbar{display:grid;grid-template-columns:1fr 1fr;height:16px;position:relative}
.dbar::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--ink);opacity:.35}
.dbar .L,.dbar .R{display:flex;gap:2px;height:100%}
.dbar .L{justify-content:flex-end;padding-right:1px} .dbar .R{padding-left:1px}
.dbar span{display:block;height:100%}
.dbar .L span:first-child{border-radius:4px 0 0 4px} .dbar .R span:last-child{border-radius:0 4px 4px 0}
.clima{display:inline-flex;align-items:center;justify-content:flex-end;gap:3px;font-family:var(--f-mono);font-size:13px;font-weight:500}
.clima .ico{width:13px;height:13px;stroke-width:2.4}
.hbars{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.hbars li{display:grid;grid-template-columns:minmax(0,1fr) minmax(60px,1.2fr) 34px;gap:10px;align-items:center;font-size:13px}
.hbars .t{display:flex;gap:7px;align-items:center;min-width:0}
.hbars .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbars .t i{width:9px;height:9px;border-radius:50%;flex:none}
.hbars .b{height:12px;background:var(--track);border-radius:0 4px 4px 0;overflow:hidden}
.hbars .b i{display:block;height:100%;border-radius:0 4px 4px 0}
.hbars .v{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.amb3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.amb3 > div{display:grid;gap:4px;padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.amb3 .n{font-family:var(--f-display);font-size:22px;line-height:1.05;font-variant-numeric:tabular-nums}
.amb3 .l{font-size:12px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.amb3 .l i{width:9px;height:9px;border-radius:50%}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grp h4{margin:0 0 8px;display:flex;align-items:center;gap:8px;font-size:14px}
.grp h4 .c{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.grp ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.grp li{border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:grid;gap:2px;background:var(--surface)}
.grp li b{font-size:13px;line-height:1.35}
.grp li span{font-size:12px;color:var(--muted)}
.grp .empty{font-size:12.5px;color:var(--muted);padding:6px 2px}
.cmp{display:grid;gap:2px}
.cmp .hd,.cmp .rw{display:grid;grid-template-columns:minmax(96px,150px) minmax(0,1fr) minmax(0,1fr) 128px;gap:16px;align-items:center}
.cmp .hd{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:0 8px 6px;border-bottom:1px solid var(--line)}
.cmp .rw{padding:9px 8px;border-radius:8px}
.cmp .rw.me{background:var(--accent-soft)}
.cmp .nm{font-weight:600}
.share{display:grid;grid-template-columns:minmax(0,1fr) 42px;gap:8px;align-items:center}
.share .b{height:14px;background:var(--track);border-radius:0 4px 4px 0;overflow:hidden}
.share .b i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--neu)}
.cmp .me .share .b i{background:var(--accent)}
.share .v{font-family:var(--f-mono);font-size:12.5px;text-align:right}
.dot{position:relative;height:20px}
.dot::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.dot::after{content:"";position:absolute;left:50%;top:2px;bottom:2px;width:1px;background:var(--ink);opacity:.3}
.dot i{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--surface);z-index:1}
.dot b{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:11.5px;font-weight:500;white-space:nowrap}
.tip{position:fixed;z-index:40;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.4;padding:7px 10px;border-radius:7px;max-width:260px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover{fill:var(--ink);fill-opacity:.05}
@media (max-width:1040px){ .r4{grid-template-columns:repeat(2,minmax(0,1fr))} .r21{grid-template-columns:minmax(0,1fr)} .cols3{grid-template-columns:minmax(0,1fr)} }
@media (max-width:820px){
  .div .hd{display:none}
  .div .rw{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 10px;border-bottom:1px solid var(--line);border-radius:0}
  .div .nm,.div .dbar{grid-column:1 / -1}
  .div .num::before{content:attr(data-l);display:block;font-family:var(--f-body);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .div .num{text-align:left}
  .cmp .hd{display:none}
  .cmp .rw{grid-template-columns:minmax(0,1fr);gap:6px}
  .r3,.amb3,.tone3{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:480px){ .r4,.r3{grid-template-columns:minmax(0,1fr)} .tile .big{font-size:30px} }

@media (max-width:1040px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .two{grid-template-columns:minmax(0,1fr)} .opts{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px}
  .brand{padding:0} .brand p{display:none}
  .org label,.plan,.usage,.side .nav,.side .foot{display:none}
  .bnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;border-radius:8px;position:relative}
  .bnav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
  .bnav .count{position:absolute;top:2px;right:calc(50% - 22px);margin:0;font-size:10px;padding:0 5px}
  .main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .form{grid-template-columns:minmax(0,1fr)}
  .item{grid-template-columns:minmax(0,1fr)}
  .item .acts{grid-column:1;grid-row:auto;flex-direction:row;align-items:center;flex-wrap:wrap}
  .steps{grid-template-columns:minmax(0,1fr)}
  .tema .top{grid-template-columns:minmax(0,1fr) auto}
  .tema .top .cnt{grid-column:1;grid-row:2}
}
@media (max-width:480px){ .kpis{grid-template-columns:minmax(0,1fr)} .head h2{font-size:23px} .opts{grid-template-columns:minmax(0,1fr)} .rows li button{grid-template-columns:minmax(0,1fr) 70px 26px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important;scroll-behavior:auto!important} }

/* ===== Sala de situación ===== */
html,body{background:var(--bg);color:var(--ink)}
body{font-size:14.5px}
.ico{stroke-width:1.9}
.demo{background:var(--bell-soft);color:var(--ink);border-bottom:1px solid var(--line);text-align:center;font-size:12px}
.demo b{color:var(--bell);text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;margin-right:8px}
.app{display:block}

/* Barra superior: identidad, municipio y estado del monitoreo */
.topbar{background:var(--top);color:var(--top-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;padding-block:12px}
.logo{display:inline-flex;align-items:center;gap:9px;margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--top-ink);text-decoration:none;line-height:1}
.logo b{color:var(--top-accent);font-weight:800}
.logo .mk{display:inline-flex;align-items:flex-end;gap:2px;height:18px}
.logo .mk i{width:5px;border-radius:1.5px;background:var(--top-accent)}
.logo .mk i:nth-child(1){height:7px;opacity:.55}.logo .mk i:nth-child(2){height:12px;opacity:.8}.logo .mk i:nth-child(3){height:18px}
.slogan{font-family:var(--f-news);font-style:italic;font-size:14px;color:var(--top-muted)}
.org{display:inline-flex;align-items:center;gap:8px}
.org label{margin:0;color:var(--top-muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.org select{width:auto;background:var(--top-line);color:var(--top-ink);border:1px solid transparent;border-radius:8px;padding:6px 10px;font-weight:700;font-size:14px;min-height:34px;cursor:pointer}
.org select:hover{border-color:var(--top-muted)}
.live{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--top-muted)}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 var(--live);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.planbox{position:relative}
.planbox summary{list-style:none;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--top-ink);border:1px solid var(--top-line);border-radius:8px;padding:6px 10px}
.planbox summary::-webkit-details-marker{display:none}
.planbox summary::after{content:" ▾";color:var(--top-muted)}
.planbox[open] summary{background:var(--top-line)}
.planbox .usage{position:absolute;right:0;top:calc(100% + 8px);z-index:25;width:260px;margin:0;padding:12px 14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(10,20,35,.18)}
.planbox .usage .row{color:var(--muted)}
.navbar{background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:15}
.navbar .nav{max-width:1240px;margin:0 auto;flex-direction:row;gap:2px;overflow-x:auto}
.navbar .nav a{border-radius:0;padding:13px 14px 11px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.navbar .nav a:hover{background:transparent;color:var(--ink)}
.navbar .nav a[aria-current="page"]{background:transparent;color:var(--ink);border-bottom-color:var(--accent)}
.navbar .nav a[aria-current="page"] .ico{color:var(--accent)}
.navbar .nav a:last-child{margin-left:auto}
.nav .count{margin-left:4px}
.main{margin:0 auto;padding-block:26px 72px}

/* Superficies y tipografía */
.card,.tile,.tema,.item,.onb{box-shadow:var(--shadow)}
.head h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.card > h3,.sec{font-size:11.5px;font-weight:700;letter-spacing:.08em}
.tile .lb{font-size:12.5px}
.tile .big,.kpi .v{font-weight:800;letter-spacing:-.02em}
.item h4,.today li b,.mini b,.grp li > b,.cola li > b{font-family:var(--f-news);font-weight:600;letter-spacing:0}
.item h4{font-size:17.5px;line-height:1.3}
.rhead h3{font-size:20px;font-weight:800}
.tabs{gap:6px;border-bottom:1px solid var(--line)}
.tabs button{font-size:14px;padding:10px 12px;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.word{font-weight:800;letter-spacing:-.02em;line-height:1.05}
.kpi .v.word{font-size:26px}
.tile .big .word{font-size:26px}
.chart text{font-family:var(--f-mono)}
.clima{font-family:var(--f-ui);font-size:12.5px;font-weight:600;white-space:nowrap}
@media (max-width:820px){ .div .rw{grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.4fr)} .clima{white-space:normal;font-size:11.5px;justify-content:flex-start} }

/* Escala del veredicto: en contra → equilibrada → a favor */
.vscale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0 4px;align-items:center;height:16px}
.vscale span{height:8px;border-radius:99px;opacity:.28}
.vscale span:nth-child(1){background:var(--cri)}
.vscale span:nth-child(2){background:color-mix(in oklab,var(--cri) 55%,var(--neu))}
.vscale span:nth-child(3){background:var(--neu)}
.vscale span:nth-child(4){background:color-mix(in oklab,var(--pos) 55%,var(--neu))}
.vscale span:nth-child(5){background:var(--pos)}
.vscale span.on{opacity:1;height:14px;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}

/* Señal de alcance: comunal, regional, nacional */
.esc{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-ui);font-size:12.5px;font-weight:600;color:var(--ink);flex-wrap:wrap}
.sig{display:inline-flex;align-items:flex-end;gap:2px;height:16px;flex:none}
.sig i{width:5px;border-radius:1.5px;background:var(--track);box-shadow:inset 0 0 0 1px var(--line)}
.sig i:nth-child(1){height:6px}.sig i:nth-child(2){height:11px}.sig i:nth-child(3){height:16px}
.sig i.on{background:var(--accent);box-shadow:none}
.esc .cts{font-family:var(--f-mono);font-size:11.5px;font-weight:400;color:var(--muted)}

/* Informes por lector */
.para{display:grid;grid-template-columns:repeat(3,minmax(0,auto)) minmax(0,1fr);gap:8px 28px;margin:0 0 18px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r)}
.para div{min-width:0}
.para dt{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.para dd{margin:2px 0 0;font-weight:600;font-size:13.5px}
.para .q dd{font-family:var(--f-news);font-style:italic;font-weight:500;font-size:16px;line-height:1.35}
.kick{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.vtx{margin:0;font-size:15px;line-height:1.5}
.parte{max-width:820px;display:grid;gap:14px}
.parte section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.parte h4{margin:0 0 12px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.vbig{font-size:40px;font-weight:800;letter-spacing:-.025em;line-height:1.05;margin:4px 0 6px}
.vbig.cri{color:var(--cri-ink)} .vbig.pos{color:var(--pos-ink)}
.ver .vtx{max-width:64ch}
.asuntos{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.asuntos li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:13px 14px;border:1px solid var(--line);border-left:4px solid var(--neu);border-radius:10px;background:var(--surface)}
.asuntos li.cri{border-left-color:var(--cri)} .asuntos li.pos{border-left-color:var(--pos)}
.asuntos .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--surface);font-weight:800;font-size:13.5px}
.asuntos li.pos .n{background:var(--pos-soft);color:var(--pos-ink)}
.asuntos .n .ico{width:17px;height:17px}
.asuntos .bd{display:grid;gap:6px;min-width:0}
.asuntos b.t{font-family:var(--f-news);font-weight:600;font-size:19px;line-height:1.28}
.asuntos .sub{font-size:12.5px}
.lleg{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.acc{margin:2px 0 0;padding:8px 10px;background:var(--accent-soft);border-radius:8px;font-size:14.5px;line-height:1.4}
.acc b,.rsp b{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-right:8px;color:var(--accent)}
.acc.sm{font-size:13.5px;margin:0}
.rsp{margin:0;font-size:13px;font-weight:600}
.rsp b{color:var(--muted)}
.parte .acts{display:flex;flex-wrap:wrap;gap:8px}
.cola{list-style:none;margin:0;padding:0;display:grid}
.grp .cola li{display:grid;gap:5px;padding:12px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent}
.grp .cola li:last-child{border-bottom:0}
.cola li > b{font-size:16.5px;line-height:1.3}
.grp .cola .esc,.grp .cola .esc span{color:var(--ink);font-size:12.5px}
.grp .cola .acc b{font-size:10.5px}
.grp h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.grp h4 .ico{width:16px;height:16px}
.grp .empty{font-size:14px}
.mtab td,.mtab th{padding:7px 6px 7px 0}
.mtab .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}

const reCache = new Map();
function termRe(t){ const k = norm(t); if (!reCache.has(k)) reCache.set(k, new RegExp("(^|[^a-z0-9])" + k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "($|[^a-z0-9])")); return reCache.get(k); }
function matchTema(tema, n){
  const found = tema.terminos.filter(t => t && termRe(t).test(n.hay));
  if (!found.length) return null;
  if (tema.exclusiones.some(e => e && termRe(e).test(n.hay))) return null;
  if (tema.contexto.length && !tema.contexto.some(c => c && termRe(c).test(n.hay))) return null;
  return {found, enTitulo: found.some(t => termRe(t).test(n.ht))};
}

function T(nombre, origen, terminos, contexto=[], exclusiones=[], extra={}){ return {id: uid(), nombre, origen, terminos, contexto, exclusiones, activo: true, ...extra}; }
function candidatos(perfil){
  const c = perfil.comuna;
  const nucleo = [
    T("Municipalidad de " + c, "Núcleo", ["Municipalidad de " + c, "Municipio de " + c]),
    T(perfil.autoridad ? perfil.autoridad : "Alcalde de " + c, "Núcleo", ["Alcalde de " + c, "Alcaldesa de " + c].concat(perfil.autoridad ? [perfil.autoridad] : [])),
    T(c + " (comuna)", "Núcleo", [c], CTX.slice(), (EXC[c] || []).slice())
  ];
  const otros = [ T("Concejo municipal", "Candidato", ["concejo municipal","concejal","concejala","concejales"], [c]) ];
  perfil.agenda.forEach(a => { if (a.trim()) otros.push(T(a.trim(), "Agenda", [a.trim()], norm(a).includes(norm(c)) ? [] : [c])); });
  Object.entries(SENS).forEach(([key, s]) => otros.push(T(s.n, perfil.sens.includes(key) ? "Sensibilidad" : "Descubrimiento", s.t.slice(), [c], [], {sens: key})));
  return {nucleo, otros};
}
function puntaje(tema){
  let vol = 0, cri = 0; const seen = new Set();
  NOTAS.forEach(n => { if (NOW - n.ts > 30*DAY) return; if (!seen.has(n.g) && matchTema(tema, n)) { seen.add(n.g); vol++; if (n.tono === "cri") cri++; } });
  const bonus = (tema.origen === "Sensibilidad" ? 5 : 0) + (tema.origen === "Agenda" ? 3 : 0);
  return {vol, cri, score: vol + cri*2 + bonus};
}
function proponer(perfil){
  const {nucleo, otros} = candidatos(perfil);
  const libres = Math.max(0, PLANES[perfil.plan].temas - nucleo.length);
  nucleo.forEach(t => Object.assign(t, puntaje(t)));
  otros.forEach(t => Object.assign(t, puntaje(t)));
  const orden = otros.filter(t => t.score > 0).sort((a,b) => b.score - a.score);
  return {base: nucleo.concat(orden.slice(0, libres)), sugeridos: orden.slice(libres, libres + 5)};
}

/* Menciones y métricas */
function menciones(c = cuenta(), dias = 30){
  const temas = c.temas.filter(t => t.activo);
  const grupos = new Map();
  NOTAS.forEach(n => {
    if (NOW - n.ts > dias*DAY) return;
    if (S.fp[S.org + ":" + n.g]) return;
    temas.forEach(t => {
      const r = matchTema(t, n); if (!r) return;
      let g = grupos.get(n.g);
      if (!g) { g = {g: n.g, notas: [], temas: new Map()}; grupos.set(n.g, g); }
      if (!g.notas.includes(n)) g.notas.push(n);
      const prev = g.temas.get(t.id) || {tema: t, found: new Set(), enTitulo: false};
      r.found.forEach(f => prev.found.add(f)); prev.enTitulo = prev.enTitulo || r.enTitulo;
      g.temas.set(t.id, prev);
    });
  });
  return [...grupos.values()].map(g => {
    g.notas.sort((a,b) => a.ts - b.ts);
    const lead = g.notas.slice().sort((a,b) => PESO[MED[b.m].l] - PESO[MED[a.m].l] || a.ts - b.ts)[0];
    const tonos = g.notas.map(n => n.tono);
    const tono = tonos.includes("cri") ? "cri" : (tonos.includes("pos") ? "pos" : "neu");
    const critico = tono === "cri" && g.notas.some(n => CRIT.some(w => n.hay.includes(w)));
    return {...g, lead, tono, critico, first: g.notas[0].ts, last: g.notas[g.notas.length-1].ts, alcance: g.notas.reduce((s,n) => s + PESO[MED[n.m].l], 0)};
  }).sort((a,b) => b.last - a.last);
}
function metricas(ms){
  const vol = ms.length, pos = ms.filter(m => m.tono==="pos").length, cri = ms.filter(m => m.tono==="cri").length, neu = vol - pos - cri;
  return {vol, pos, neu, cri, neto: vol ? Math.round((pos - cri) / vol * 100) : 0, alcance: ms.reduce((s,m) => s + m.alcance, 0)};
}

function ambitos(ms){ const r = {nacional:0, regional:0, local:0}; ms.forEach(m => m.notas.forEach(n => r[MED[n.m].a] = (r[MED[n.m].a]||0) + 1)); return r; }

function chartDias(ms, n = 30){
  const W = 720, H = 200, L = 30, B = 26, top = 10;
  const days = Array.from({length:n}, (_,i) => ({pos:0, neu:0, cri:0, d: n-1-i}));
  ms.forEach(m => { const d = Math.floor((NOW - m.last)/DAY); if (d < n) days[n-1-d][m.tono]++; });
  const max = Math.max(3, ...days.map(x => x.pos+x.neu+x.cri)), step = Math.ceil(max/3), ymax = step*3, slot = (W-L-8)/n, bw = Math.min(16, slot - 4);

    const X = L + 4 + i*slot + (slot - bw)/2, dt = new Date(NOW - x.d*DAY), lbl = dt.toLocaleDateString("es-CL", {weekday:"short", day:"numeric", month:"short"});
    const tot = x.pos + x.neu + x.cri; let acc = 0; const segs = [["neu","var(--neu)"],["pos","url(#pat-pos)"],["cri","var(--cri)"]].filter(([k]) => x[k]);
    segs.forEach(([k,col], j) => { const y1 = y(acc + x[k]) + (j ? 0 : 0), y0 = y(acc) - (acc ? 2 : 0), h = Math.max(1, y0 - y1), last = j === segs.length - 1;
      g += last ? `<path d="M${X},${y0} V${y1+4} Q${X},${y1} ${X+4},${y1} H${X+bw-4} Q${X+bw},${y1} ${X+bw},${y1+4} V${y0} Z" fill="${col}"/>` : `<rect x="${X}" y="${y1}" width="${bw}" height="${h}" fill="${col}"/>`; acc += x[k]; });
    if (i % 5 === 4 || i === n-1) g += `<text x="${X + bw/2}" y="${H-8}" text-anchor="middle">${dt.getDate()}/${dt.getMonth()+1}</text>`;
    g += `<rect class="hit" x="${L + 4 + i*slot}" y="${top}" width="${slot}" height="${H-top-B}" ${tipAttr(`${lbl}: ${tot ? [x.cri && plural(x.cri,"crítica","críticas"), x.neu && plural(x.neu,"neutra","neutras"), x.pos && plural(x.pos,"positiva","positivas")].filter(Boolean).join(", ") : "sin noticias"}`)}/>`;
  });
  return `<div class="scroll"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px" role="img" aria-label="Noticias por día y tono, últimos ${n} días">${g}</svg></div><div class="legend"><span><i style="background:var(--cri)"></i>Críticas</span><span><i style="background:var(--neu)"></i>Neutras</span><span><i style="background:var(--pos)"></i>Positivas</span></div>`;

const muestra = n => n < 20 ? `<p class="note" style="margin-top:14px">Muestra pequeña (${plural(n,"noticia","noticias")}): las proporciones pueden cambiar mucho con pocas notas nuevas.</p>` : "";

/* Hasta dónde llegó: comunal → regional → nacional */
const NIVS = [["local","Comunal"],["regional","Regional"],["nacional","Nacional"]];
const nivIdx = a => a === "nacional" ? 2 : a === "regional" ? 1 : 0;
function escalera(notas){
  const ord = notas.slice().sort((a,b) => a.ts - b.ts), r = NIVS.map(([k,l]) => ({k, l, n:0, first:null}));
  ord.forEach(n => { const x = r[nivIdx(MED[n.m].a)]; x.n++; if (x.first === null) x.first = n.ts; });
  const max = r.reduce((s,x,i) => x.n ? i : s, -1), inicio = ord.length ? nivIdx(MED[ord[0].m].a) : -1;
  return {r, max, inicio, subio: max > inicio};
}
const llego = e => e.max < 0 ? "Sin noticias" : ["Solo prensa comunal","Llegó a prensa regional","Llegó a prensa nacional"][e.max];

const ruta = e => e.r.filter(x => x.n).sort((a,b) => a.first - b.first).map(x => x.l + " " + hora(x.first)).join(" → ");

/* Quién se hace cargo */

  const e = escalera(m.notas), area = areaDe(m); let a, r;
  if (m.tono === "cri") {
    if (respondida(m.g)) { a = "La respuesta ya está aprobada. Seguir el tema y avisar si aparece en otro medio."; r = ["Comunicaciones"]; }
    else if (e.max === 2) { a = "Vocería del alcalde hoy, con datos oficiales y una sola versión."; r = ["Alcalde","Comunicaciones",area]; }

/* 1. Parte del alcalde: semanal, una pantalla */
function parteData(){
  const all = menciones(cuenta(), 14), sem = all.filter(m => NOW - m.last < 7*DAY), ant = all.filter(m => NOW - m.last >= 7*DAY);
  const M = metricas(sem), Ma = metricas(ant), v = veredicto(M), va = veredicto(Ma);
  const cand = sem.filter(m => m.tono !== "pos").sort((a,b) => riesgo(b) - riesgo(a)), asuntos = [], vistos = new Set();
  cand.forEach(m => { if (asuntos.length < 3 && riesgo(m) >= 4 && (m.tono === "cri" || (areaDe(m) && riesgo(m) >= 6)) && !vistos.has(temaDe(m))) { asuntos.push(m); vistos.add(temaDe(m)); } });
  cand.forEach(m => { if (asuntos.length < 3 && !asuntos.includes(m) && riesgo(m) >= 12) asuntos.push(m); });
  const buena = sem.filter(m => m.tono === "pos").sort((a,b) => escalera(b.notas).max - escalera(a.notas).max || b.notas.length - a.notas.length)[0];
  const comp = va.i < 0 ? "No hay datos de la semana anterior para comparar." : va.i === v.i ? `Igual que la semana anterior.` : `La semana anterior fue ${va.n.toLowerCase()}: ${v.i < va.i ? "mejoró" : "empeoró"}.`;
  return {sem, M, v, comp, asuntos, buena, per: rango(NOW - 6*DAY, NOW)};
}

    <section><h4>Lo que se puede complicar</h4>${d.asuntos.length ? `<ol class="asuntos">${d.asuntos.map(item).join("")}</ol>` : `<p class="vtx">Ningún asunto de riesgo esta semana.</p>`}</section>
    ${d.buena ? `<section class="cap"><h4>Para aprovechar</h4><ol class="asuntos">${item(d.buena, -1).replace('<span class="n">0</span>', `<span class="n">${ri("pos")}</span>`)}</ol></section>` : ""}

/* 2. Mesa de comunicaciones: diaria, para operar */
function repMesa(){
  const c = cuenta(), m30 = menciones(c), m7 = m30.filter(m => NOW - m.last < 7*DAY), hoy = m30.filter(m => NOW - m.last < DAY);
  const porResp = m7.filter(m => m.tono === "cri" && !respondida(m.g)).sort((a,b) => escalera(b.notas).max - escalera(a.notas).max || b.last - a.last);
  const subiendo = m7.filter(m => escalera(m.notas).subio).sort((a,b) => b.last - a.last);
  const difundir = m30.filter(m => m.tono === "pos" && NOW - m.last < 14*DAY && escalera(m.notas).max < 2 && !respondida(m.g)).sort((a,b) => escalera(a.notas).max - escalera(b.notas).max || b.last - a.last);
  const md = {}; m30.forEach(m => m.notas.forEach(n => { const x = md[n.m] ||= {n:0, cri:0, pos:0}; x.n++; if (n.tono === "cri") x.cri++; if (n.tono === "pos") x.pos++; }));
  const medios = Object.entries(md).sort((a,b) => nivIdx(MED[a[0]].a) - nivIdx(MED[b[0]].a) || b[1].n - a[1].n).slice(0, 10);
  const li = (m, btn, extra = "") => `<li><span class="kick">${esc(temaDe(m))} · ${tonoLbl[m.tono]}</span><b>${esc(m.lead.res)}</b><span class="sub">${enMedios(m)} · ${ago(m.last)}</span>${escHtml(escalera(m.notas))}${extra}${btn ? `<button class="btn sm" style="justify-self:start" data-act="responder" data-g="${m.g}" data-from="reportes">${btn}</button>` : ""}</li>`;
  const vacio = t => `<p class="empty">${t}</p>`;

function propagacion(m){
  const W = 720, H = 220, L = 40, R = 20, B = 30, top = 30;
  const t0 = m.first, span = Math.max(1, (m.notas[m.notas.length-1].ts - t0) / 36e5), xmax = Math.max(1, Math.ceil(span));
  const x = h => L + (W - L - R) * h / xmax, ymax = Math.max(2, m.notas.length), y = v => top + (H - top - B) * (1 - v / ymax);
  let g = "", path = `M${x(0)},${y(0)}`;
  for (let v = 0; v <= ymax; v++) g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  const stepH = xmax <= 6 ? 1 : Math.ceil(xmax / 6);
  for (let h = 0; h <= xmax; h += stepH) g += `<text x="${x(h)}" y="${H-10}" text-anchor="middle">${h === 0 ? "inicio" : "+" + h + " h"}</text>`;
  m.notas.forEach((n, i) => { const h = (n.ts - t0) / 36e5; path += ` H${x(h)} V${y(i+1)}`; });
  path += ` H${x(xmax)}`;
  g += `<path d="${path}" fill="none" stroke="var(--cri)" stroke-width="2" stroke-linejoin="round"/>`;
  m.notas.forEach((n, i) => { const h = (n.ts - t0) / 36e5, cx = x(h), cy = y(i+1), md = MED[n.m];
    g += `<circle cx="${cx}" cy="${cy}" r="6" fill="${ambCol(md.a)}" stroke="var(--surface)" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="14" fill="transparent" ${tipAttr(`${md.n} (${md.a}) · ${new Date(n.ts).toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"})} · ${n.res}`)}/>`;
    if (i === 0 || i === m.notas.length - 1) { const last = i && i === m.notas.length - 1; g += `<text x="${cx + (last ? -12 : 12)}" y="${last ? cy + 20 : cy - 12}" text-anchor="${last ? "end" : "start"}" style="font-family:var(--f-body);font-size:11.5px;fill:var(--ink)">${esc(md.n.split(",")[0])}</text>`; } });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Medios acumulados que publicaron la noticia, por hora">${g}</svg><div class="legend">${AMB.map(([k,l,c]) => `<span><i style="background:${c};border-radius:50%"></i>Medio ${l.toLowerCase()}</span>`).join("")}<span><i style="background:var(--cri);height:2px;width:14px;border-radius:0"></i>Medios acumulados</span></div>`;
}

function chipAdd(el){

}

  if (act === "quitar") { const i = c.temas.findIndex(t => t.id === b.dataset.id); if (i >= 0) { const t = c.temas.splice(i,1)[0]; c.sugeridos.unshift(t); save(); render(); toast(`Quitaste el tema ${t.nombre}.`, () => { c.sugeridos.splice(c.sugeridos.indexOf(t),1); c.temas.splice(i,0,t); save(); render(); }); } }

    const txt = $("#kOut").value.trim(); if (!txt) return;

/* IA desde la página (usa la cuenta de Claude de quien la abre) */
let samplePromise = (window.claude && window.claude.use) ? window.claude.use("sample").catch(() => null) : Promise.resolve(null);
let ctl = null;
function prompt(m, pieza, enfoque, base){
  return `Eres el asistente de comunicaciones de PregonIA para la Municipalidad de ${S.org}, en Chile. Redacta en español de Chile: ${PIEZAS[pieza][2]}. Enfoque: ${ENFOQUES[enfoque]}.

Reglas obligatorias:
1. Usa solo datos que estén en los DATOS DEL MUNICIPIO o en la NOTICIA. Si falta un dato necesario, escribe [completar: qué dato falta]. No inventes cifras, fechas, nombres ni compromisos.
2. Toda cita textual va marcada así: [cita propuesta, validar con el vocero].
3. No copies frases del medio; describe la noticia con palabras propias y nombra el medio.
4. Tono institucional, sobrio y respetuoso. Sin promoción personal ni partidaria de ninguna autoridad.
5. Devuelve solo el texto de la pieza, sin explicaciones previas.

NOTICIA:
${m ? `Medio: ${MED[m.lead.m].n}. Titular: ${m.lead.t}. Resumen: ${m.lead.res}. Tono detectado: ${tonoLbl[m.tono]}. Otros medios que la publicaron: ${m.notas.length-1}.` : "No hay noticia: es un anuncio propio."}

DATOS DEL MUNICIPIO:
${base}`;
}
function plantilla(m, pieza){
  return `${PIEZAS[pieza][0]} · Municipalidad de ${S.org}\n\n[Plantilla: la IA no está disponible en esta vista]\n\nEn relación con ${m ? "lo informado por " + MED[m.lead.m].n + " (" + m.lead.res.replace(/\.$/,"") + ")" : "[completar: anuncio]"}, la Municipalidad de ${S.org} informa:\n\n1. [completar: hechos verificados]\n2. [completar: medidas adoptadas y plazos]\n3. [completar: canal de contacto para vecinos]\n\n[cita propuesta, validar con el vocero]: «[completar]»\n\nContacto de prensa: [completar]`;
}
function setDraft(txt){ const c = cuenta(); (c.drafts ||= {})[tState.draft || "_"] = txt; const has = !!txt.trim(); const a = $("#btnAprob"), k = $("#btnCopy"); if (a) a.disabled = !has; if (k) k.disabled = !has; }
async function generar(){
  const c = cuenta(), pl = PLANES[c.perfil.plan];
  const m = tState.draft && menciones().find(x => x.g === tState.draft);
  const pieza = document.querySelector('input[name="pieza"]:checked')?.value || "comunicado", enfoque = document.querySelector('input[name="enf"]:checked')?.value || "datos", base = $("#kBase").value;
  c.base = base;
  const out = $("#kOut"), btn = $("#btnGen"), stop = $("#btnStop"), note = $("#kNote");
  const sample = await samplePromise;
  if (!sample) { out.value = plantilla(m, pieza); setDraft(out.value); c.borradores = (c.borradores||0) + 1; save(); renderChrome(); note.textContent = "La IA no está disponible en esta vista, así que usamos una plantilla. Abre la página en Claude para redactar con IA."; return; }
  ctl = new AbortController(); btn.disabled = true; stop.hidden = false; out.value = "Redactando…";
  try {
    const {text} = await sample(prompt(m, pieza, enfoque, base), {signal: ctl.signal, cache: false, onText: ({text}) => { out.value = text; }});
    out.value = text; setDraft(text); c.borradores = (c.borradores||0) + 1; save(); renderChrome();
    note.textContent = (c.borradores > pl.borradores ? "Superaste los borradores de tu plan; en producción se suma un paquete. " : "") + "Revisa lo marcado [completar] y las citas propuestas antes de aprobar.";
  } catch(err) {
    out.value = err && err.text ? err.text : "";
    if (err && (err.code === "not_granted" || err.code === "sampling_disabled")) { out.value = plantilla(m, pieza); note.textContent = "No se autorizó el uso de Claude en esta vista; usamos una plantilla."; }
    else if (err && err.code === "cancelled") note.textContent = "Redacción detenida. Puedes editar lo que alcanzó a escribir.";
    else if (err && err.code === "rate_limited") note.textContent = "Llegaste al límite de uso por ahora. Intenta más tarde.";
    else note.textContent = "No se pudo terminar el borrador. Intenta de nuevo en un momento.";
    setDraft(out.value); save();
  } finally { btn.disabled = false; stop.hidden = true; }
}
async function lectura(btn){
  const c = cuenta(), ms = menciones(c), M = metricas(ms), el = $("#lectura");
  const sample = await samplePromise;
  if (!sample) { el.textContent = "La IA no está disponible en esta vista. Abre la página en Claude para redactar la lectura."; return; }
  btn.disabled = true; el.textContent = "Redactando…";
  const datos = ms.slice(0, 25).map(m => `- [${tonoLbl[m.tono]}] ${m.lead.res} (${m.notas.length} medio(s); ${llego(escalera(m.notas)).toLowerCase()})`).join("\n");
  const temas = c.temas.filter(t=>t.activo).map(t => { const sub = ms.filter(m => m.temas.has(t.id)), x = metricas(sub); return `${t.nombre}: ${x.vol} noticias, ${x.cri} críticas, ${llego(escalera(sub.flatMap(m => m.notas))).toLowerCase()}`; }).join("; ");
  try {
    const {text} = await sample(`Eres analista de reputación de PregonIA. Escribe en español de Chile la "lectura del analista" del informe de gestión mensual de la Municipalidad de ${S.org}. Lo leen el alcalde y su equipo directivo en reunión. Dos párrafos breves: qué temas de gestión marcaron la percepción y por qué, qué temas escalaron de la prensa comunal a la regional o nacional, y dos recomendaciones accionables con el área municipal responsable. Usa solo estos datos, no inventes cifras ni hechos, habla de gestión y servicios, no de la figura del alcalde, y no promuevas a ninguna autoridad ni partido.\n\nCifras del mes: ${M.vol} noticias, tono de la cobertura ${veredicto(M).n.toLowerCase()} (${conteo(M)}).\nPor tema: ${temas}\nResúmenes:\n${datos}`, {onText: ({text}) => { el.textContent = text; }});
    lecturaTxt.gestion = text; el.textContent = text;
  } catch(err) {
    el.textContent = err && err.text ? err.text : (err && err.code === "not_granted" ? "No se autorizó el uso de Claude en esta vista." : "No se pudo redactar la lectura. Intenta de nuevo en un momento.");
  } finally { btn.disabled = false; }
}

    ["¿Revisa redes sociales?", "No. Esta versión cubre medios digitales. Las redes sociales quedan para una etapa posterior."]
  ]],
  ["Lectura de los resultados", [
    ["¿Cómo se decide si una noticia es crítica, neutra o positiva?", "Una IA clasifica el tono de cada noticia respecto del tema vigilado, no del medio en general. Si no estás de acuerdo, puedes marcarlo; esas correcciones sirven para mejorar la clasificación."],
    ["¿Qué significa \"favorable\" o \"desfavorable\"?", "Es el veredicto del período en cinco niveles, de muy desfavorable a muy favorable. Compara las noticias positivas con las críticas sobre el total: si se compensan, la cobertura es equilibrada. Siempre va con los conteos para que veas de dónde sale."],
    ["¿Qué es \"hasta dónde llegó\"?", "Las tres barras muestran el nivel de prensa más alto que alcanzó una noticia o un tema: comunal, regional o nacional. Un tema que nace en un medio comunal y aparece después en uno regional es una señal temprana de riesgo: todavía se puede contener."],
    ["¿Qué es el alcance?", "Un puntaje que pesa más una nota en un medio nacional que en uno local: nacional vale 3, regional 2 y local 1."],
    ["¿Por qué dice \"muestra pequeña\"?", "Cuando hay menos de 20 noticias, unas pocas notas nuevas pueden cambiar mucho las proporciones. Úsalas como orientación, no como tendencia."],
    ["¿Cómo se eligen los asuntos del parte del alcalde?", "Por riesgo: pesan el tono, el nivel de prensa alcanzado, cuántos medios lo publicaron, si es reciente y si ya tiene respuesta. Se muestran tres como máximo, de temas distintos."],
    ["¿Quién define el responsable sugerido?", "PregonIA lo asigna según las palabras de la noticia (emergencias, agua, salud, obras, entre otras). Es una sugerencia: cada municipio puede ajustar ese mapa a su organigrama."]
  ]],
  ["Comunicados e IA", [
    ["¿La IA publica algo por su cuenta?", "No. Solo prepara borradores. Una persona los revisa, completa y aprueba; publicar o enviar es siempre una decisión del municipio."],
    ["¿De dónde saca los datos la IA?", "Solo de la noticia y de los datos que el municipio carga (cifras, documentos, decisiones). Si falta un dato, lo marca [completar] en vez de inventarlo, y las citas quedan marcadas para validarlas con el vocero."],
    ["¿Qué es una aclaración por Ley 19.733?", "La ley de prensa da derecho a quien fue aludido por información inexacta o injuriosa a que el medio publique su aclaración o rectificación, dentro de los plazos que fija la ley. PregonIA prepara el borrador de la carta; conviene que lo revise el área jurídica antes de enviarlo."],
    ["¿Puede la IA escribir sobre el alcalde?", "Puede redactar comunicados institucionales, pero evita la promoción personal o partidaria. En cuentas municipales advierte cuando un borrador se acerca a eso, por las reglas sobre uso de recursos públicos."]
  ]],
  ["Plan y cuenta", [
    ["¿Qué pasa si llego al límite del plan?", "PregonIA avisa al 80% y al 100% del límite de temas, menciones o borradores. Antes de sumar un paquete conviene ajustar exclusiones; si hace falta, se suma un paquete de 5 temas."],
    ["¿Otros municipios ven mis datos?", "No. Cada cuenta ve solo lo suyo. La comparación con las comunas vecinas usa solo noticias públicas, nunca la configuración ni los datos de otra cuenta."],
    ["¿Cuántas personas pueden usarlo?", "El plan Comunal incluye 3 usuarios y el Regional o Político, 5."],
    ["¿Cómo comparto el parte con el alcalde?", "En Reportes › Parte del alcalde, el botón \"Copiar para WhatsApp\" deja el texto listo para pegar en un mensaje o un correo."]
  ]]
];
let helpOpen = false, helpQ = "", helpReturn = null, helpCtl = null;
function ayudaVista(){ const k = route(); return k === "reportes" ? AYUDA_VISTA["rep_" + tState.rep] || AYUDA_VISTA.rep_alcalde : AYUDA_VISTA[k] || AYUDA_VISTA.inicio; }
function faqHtml(){
  const q = norm(helpQ.trim()), grupos = FAQ.map(([g, items]) => [g, items.filter(([p, r]) => !q || norm(p + " " + r).includes(q))]).filter(([, it]) => it.length), n = grupos.reduce((s, [, it]) => s + it.length, 0);
  if (!n) return `<p class="hint">Ninguna pregunta frecuente coincide con «${esc(helpQ)}». Pregúntale a PregonIA más abajo.</p>`;
  return (q ? `<p class="hint">${plural(n, "pregunta coincide", "preguntas coinciden")}.</p>` : "") + grupos.map(([g, items]) => `<div class="hp-grp"><h4>${g}</h4>${items.map(([p, r]) => `<details ${q ? "open" : ""}><summary>${esc(p)}</summary><p>${esc(r)}</p></details>`).join("")}</div>`).join("");
}
function renderHelp(){
  const el = $("#help"); if (!el) return;
  const [t, d] = ayudaVista();
  el.querySelector(".hp-body").innerHTML = `
    <section class="hp-here"><span class="kick">Estás en</span><h3>${esc(t)}</h3><p>${esc(d)}</p></section>
    <section><h3 class="hp-h">Cómo se usa, en cinco pasos</h3><ol class="hp-guia">${GUIA.map(([a, b]) => `<li><b>${a}</b><span>${b}</span></li>`).join("")}</ol></section>
    <section><h3 class="hp-h">Preguntas frecuentes</h3><input id="helpQ" class="hp-q" type="search" placeholder="Busca, por ejemplo: tono, WhatsApp, límite" aria-label="Buscar en las preguntas frecuentes" value="${esc(helpQ)}"><div id="faqOut">${faqHtml()}</div></section>
    <section class="hp-ask"><h3 class="hp-h">¿No encuentras la respuesta?</h3><p class="hint" style="margin:0 0 8px">Pregúntale a PregonIA. Responde con la guía y las preguntas frecuentes de este sistema.</p>
      <form id="helpForm"><textarea id="helpAsk" rows="2" placeholder="Por ejemplo: ¿cómo agrego un tema nuevo?" aria-label="Tu pregunta"></textarea><div style="display:flex;gap:8px;margin-top:8px"><button class="btn primary sm" type="submit" id="helpBtn">Preguntar</button><button class="btn sm" type="button" data-act="help-stop" id="helpStop" hidden>Detener</button></div></form>
      <div id="helpAns" class="hp-ans" aria-live="polite" hidden></div></section>`;
}
function abrirAyuda(){
  helpReturn = document.activeElement; helpOpen = true; renderHelp();
  $("#help").hidden = false; $("#helpBack").hidden = false; document.body.classList.add("hp-on");
  $("#help .hp-x").focus();
}
function cerrarAyuda(){
  helpCtl?.abort(); helpOpen = false; $("#help").hidden = true; $("#helpBack").hidden = true; document.body.classList.remove("hp-on");
  if (helpReturn && helpReturn.focus) helpReturn.focus();
}
async function preguntarAyuda(){
  const q = $("#helpAsk").value.trim(), out = $("#helpAns"), btn = $("#helpBtn"), stop = $("#helpStop"); if (!q) return;
  out.hidden = false;
  const sample = await samplePromise;
  if (!sample) { out.textContent = "La IA no está disponible en esta vista. Abre la página en Claude para preguntarle a PregonIA, o revisa las preguntas frecuentes."; return; }
  const [t, d] = ayudaVista();
  const base = `PANTALLA ACTUAL: ${t}. ${d}\n\nGUÍA:\n${GUIA.map(([a, b], i) => `${i + 1}. ${a}: ${b}`).join("\n")}\n\nPREGUNTAS FRECUENTES:\n${FAQ.flatMap(([g, it]) => it.map(([p, r]) => `[${g}] ${p} ${r}`)).join("\n")}\n\nPANTALLAS: ${Object.values(AYUDA_VISTA).map(([a, b]) => a + ": " + b).join(" | ")}`;
  helpCtl = new AbortController(); btn.disabled = true; stop.hidden = false; out.textContent = "Pensando…";
  try {
    const {text} = await sample(`Eres la ayuda de PregonIA, un sistema que monitorea noticias sobre municipios en medios digitales chilenos. Responde en español de Chile, en tono cordial y directo, en máximo 120 palabras, la pregunta del usuario. Usa solo la información de abajo. Si la respuesta no está, dilo con claridad y sugiere escribir al equipo de ALTkimia; no inventes funciones, cifras ni plazos. Cuando ayude, indica dónde está la opción (por ejemplo: Ajustes › Mis temas).\n\n${base}\n\nPREGUNTA: ${q}`, {signal: helpCtl.signal, cache: false, modelTier: "quick", onText: ({text}) => { out.textContent = text; }});
    out.textContent = text;
  } catch(err) {
    out.textContent = err && err.text ? err.text : err && err.code === "cancelled" ? "Respuesta detenida." : err && err.code === "not_granted" ? "No se autorizó el uso de Claude en esta vista. Revisa las preguntas frecuentes." : err && err.code === "rate_limited" ? "Llegaste al límite de uso por ahora. Intenta más tarde." : "No se pudo responder ahora. Intenta de nuevo en un momento.";
  } finally { btn.disabled = false; stop.hidden = true; }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "help") { helpOpen ? cerrarAyuda() : abrirAyuda(); }
  if (b.dataset.act === "help-close") cerrarAyuda();
  if (b.dataset.act === "help-stop") helpCtl?.abort();
});
document.addEventListener("input", e => { if (e.target.id === "helpQ") { helpQ = e.target.value; $("#faqOut").innerHTML = faqHtml(); } });
document.addEventListener("submit", e => { if (e.target.id === "helpForm") { e.preventDefault(); preguntarAyuda(); } });
document.addEventListener("keydown", e => {
  if (!helpOpen) return;
  if (e.key === "Escape") { e.preventDefault(); cerrarAyuda(); }
  if (e.key === "Enter" && !e.shiftKey && e.target.id === "helpAsk") { e.preventDefault(); preguntarAyuda(); }
  if (e.key === "Tab") { const f = [...$("#help").querySelectorAll('button:not([hidden]):not(:disabled),input,textarea,summary,a[href]')].filter(x => x.offsetParent); if (!f.length) return; const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
});
window.addEventListener("hashchange", () => { if (helpOpen) renderHelp(); });

render();

</script>
