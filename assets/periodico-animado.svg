<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Periódico pasando sus páginas">
  <!-- Ícono animado: periódico abierto (dos columnas, titular y foto) que da vuelta sus páginas.
       Color con --tinta (trazo) y --papel (relleno); por defecto azul PregonIA sobre blanco. Se queda quieto con «reducir movimiento». -->
  <style>
    svg { --tinta: #2196F3; --papel: #FFFFFF; }
    .p { fill: var(--papel); stroke: var(--tinta); stroke-width: 2.2; stroke-linejoin: round; }
    .t { stroke: var(--tinta); stroke-width: 3.4; stroke-linecap: round; }
    .l { stroke: var(--tinta); stroke-width: 1.9; stroke-linecap: round; opacity: .5; }
    .f { fill: var(--tinta); opacity: .35; }
    .izq { transform-box: view-box; transform-origin: 32px 32px; transform: scaleX(-1); }
    .hoja { transform-box: view-box; transform-origin: 32px 32px; animation: pasar 2.4s cubic-bezier(.45,.05,.35,1) infinite; }
    .sombra { fill: var(--tinta); opacity: 0; animation: sombra 2.4s cubic-bezier(.45,.05,.35,1) infinite; }
    @keyframes pasar {
      0%   { transform: scaleX(1) skewY(0); }
      22%  { transform: scaleX(.1) skewY(-10deg); }
      45%  { transform: scaleX(-1) skewY(0); }
      100% { transform: scaleX(-1) skewY(0); }
    }
    @keyframes sombra { 0%, 45%, 100% { opacity: 0; } 20% { opacity: .14; } }
    @media (prefers-reduced-motion: reduce) { .hoja, .sombra { animation: none; } }
  </style>
  <!-- Página izquierda: el reflejo exacto de la derecha, para que la hoja que pasa calce sin salto -->
  <g class="izq">
    <path class="p" d="M32 14 H54.5 a1.5 1.5 0 0 1 1.5 1.5 V48.5 a1.5 1.5 0 0 1 -1.5 1.5 H32 Z"/>
    <line class="t" x1="36" y1="19.5" x2="52" y2="19.5"/>
    <line class="l" x1="36" y1="26" x2="42.5" y2="26"/><line class="l" x1="36" y1="30.5" x2="42.5" y2="30.5"/><line class="l" x1="36" y1="35" x2="42.5" y2="35"/><line class="l" x1="36" y1="39.5" x2="42.5" y2="39.5"/><line class="l" x1="36" y1="44" x2="41" y2="44"/>
    <line class="l" x1="45.5" y1="26" x2="52" y2="26"/><line class="l" x1="45.5" y1="30.5" x2="52" y2="30.5"/>
    <rect class="f" x="45.5" y="34" width="6.5" height="11" rx="1.2"/>
  </g>
  <!-- Página derecha -->
  <g>
    <path class="p" d="M32 14 H54.5 a1.5 1.5 0 0 1 1.5 1.5 V48.5 a1.5 1.5 0 0 1 -1.5 1.5 H32 Z"/>
    <line class="t" x1="36" y1="19.5" x2="52" y2="19.5"/>
    <line class="l" x1="36" y1="26" x2="42.5" y2="26"/><line class="l" x1="36" y1="30.5" x2="42.5" y2="30.5"/><line class="l" x1="36" y1="35" x2="42.5" y2="35"/><line class="l" x1="36" y1="39.5" x2="42.5" y2="39.5"/><line class="l" x1="36" y1="44" x2="41" y2="44"/>
    <line class="l" x1="45.5" y1="26" x2="52" y2="26"/><line class="l" x1="45.5" y1="30.5" x2="52" y2="30.5"/>
    <rect class="f" x="45.5" y="34" width="6.5" height="11" rx="1.2"/>
  </g>
  <path class="sombra" d="M32 14 H56 V50 H32 Z"/>
  <!-- Hoja que da vuelta -->
  <g class="hoja">
    <path class="p" d="M32 14 H54.5 a1.5 1.5 0 0 1 1.5 1.5 V48.5 a1.5 1.5 0 0 1 -1.5 1.5 H32 Z"/>
    <line class="t" x1="36" y1="19.5" x2="52" y2="19.5"/>
    <line class="l" x1="36" y1="26" x2="42.5" y2="26"/><line class="l" x1="36" y1="30.5" x2="42.5" y2="30.5"/><line class="l" x1="36" y1="35" x2="42.5" y2="35"/><line class="l" x1="36" y1="39.5" x2="42.5" y2="39.5"/><line class="l" x1="36" y1="44" x2="41" y2="44"/>
    <line class="l" x1="45.5" y1="26" x2="52" y2="26"/><line class="l" x1="45.5" y1="30.5" x2="52" y2="30.5"/>
    <rect class="f" x="45.5" y="34" width="6.5" height="11" rx="1.2"/>
  </g>
  <line x1="32" y1="14" x2="32" y2="50" stroke="var(--tinta)" stroke-width="2.2" stroke-linecap="round"/>
</svg>
